name: CI

on:
  push:
    branches:
      - main
      - claude/sandstorm-snowflow-derivative-l1yu2p
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release bundle
        run: npm run release:check

      - name: Smoke production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4314 >/tmp/sandstorm-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl --fail --silent --show-error http://127.0.0.1:4314/ >/tmp/sandstorm-index.html; then
              break
            fi
            sleep 0.25
          done
          test -s /tmp/sandstorm-index.html
          grep -qi 'SANDSTORM' /tmp/sandstorm-index.html

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
